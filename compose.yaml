services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - hris-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=HRIS
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://hris.lgucalapan.ph
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hris
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD:-laravel_pass}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database

  db:
    image: mysql:8.0
    container_name: hris-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hris
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-s3cr3t}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_pass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hris-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-s3cr3t}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: hris-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hris-network

networks:
  hris-network:
    driver: bridge

volumes:
  db_data:
  vendor_data:
