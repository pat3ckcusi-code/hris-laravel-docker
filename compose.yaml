name: hris-app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: hris-app:latest
    pull_policy: build   # built locally, not in a registry - don't try to `docker compose pull` it
    container_name: hris-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - ./storage/app/templates:/var/www/html/storage/app/templates   # host-bind: always use latest template
    networks: [hris-network]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_NAME=HRIS
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://chrmis.lgucalapan.ph
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hris
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: hris-nginx:latest
    pull_policy: build   # built locally, not in a registry - don't try to `docker compose pull` it
    container_name: hris-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on: [app]
    volumes:
      - storage_app:/var/www/html/storage/app:ro
    networks: [hris-network]

  db:
    image: mysql:8.0
    container_name: hris-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hris
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [hris-network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: hris-app:latest
    pull_policy: build
    container_name: hris-queue
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: []
    command: ["php", "artisan", "queue:work",
              "--queue=exports,default",
              "--sleep=3", "--tries=3", "--timeout=660", "--max-jobs=500"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      - APP_NAME=HRIS
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://chrmis.lgucalapan.ph
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hris
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - DB_QUEUE_RETRY_AFTER=660
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - ./storage/app/templates:/var/www/html/storage/app/templates
    networks: [hris-network]

  queue-exports:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: hris-app:latest
    pull_policy: build
    container_name: hris-queue-exports
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: []
    command: ["php", "artisan", "queue:work",
              "--queue=exports",
              "--sleep=3", "--tries=3", "--timeout=660", "--max-jobs=500"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      - APP_NAME=HRIS
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://chrmis.lgucalapan.ph
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hris
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - DB_QUEUE_RETRY_AFTER=660
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - ./storage/app/templates:/var/www/html/storage/app/templates
    networks: [hris-network]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: hris-app:latest
    pull_policy: build
    container_name: hris-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      - APP_NAME=HRIS
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://chrmis.lgucalapan.ph
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hris
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - ./storage/app/templates:/var/www/html/storage/app/templates
    networks: [hris-network]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hris-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [hris-network]

networks:
  hris-network:
    driver: bridge

volumes:
  db_data:
  storage_app:
  storage_logs:
