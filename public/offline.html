<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline - HRIS</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        height: 100%;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .card {
        max-width: 360px;
        text-align: center;
    }
    svg {
        width: 56px;
        height: 56px;
        margin-bottom: 16px;
        color: #0f172a;
    }
    h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
    }
    p {
        margin: 0 0 24px;
        color: #475569;
        line-height: 1.5;
    }
    button {
        appearance: none;
        border: none;
        background: #ea580c;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
    }
    button:hover {
        background: #c2410c;
    }
</style>
</head>
<body>
    <div class="card">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 8.5a15 15 0 0 1 18 0M6.5 12a10 10 0 0 1 11 0M10 15.5a5 5 0 0 1 4 0" stroke-linecap="round"/>
            <line x1="2" y1="2" x2="22" y2="22" stroke-linecap="round"/>
            <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <h1>You're offline</h1>
        <p>HRIS needs an internet connection to load this page. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
