; Allow uploads up to 512 MB - required for database backup restore.
; nginx client_max_body_size is also set to 512M in nginx.conf - keep both in sync.
upload_max_filesize = 512M
post_max_size       = 512M
memory_limit        = 256M

; Stock PHP default (1000) silently truncates large bulk-select form submissions
; (e.g. Shift Schedule's "select all" over the full employee roster, one user_ids[]
; field per employee) with no error - excess fields are just dropped during request
; parsing, before Laravel ever sees them. Sized with headroom above the current
; ~1,644-employee active roster.
max_input_vars = 5000
