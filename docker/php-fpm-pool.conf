; Overrides the stock php:8.4-fpm www.conf pool sizing (pm.max_children=5),
; which under-provisions worker count for this app - loaded last (zz- prefix)
; so these directives win over the base image's own www.conf.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers periodically to guard against memory growth, mirroring the
; --max-jobs=500 convention already used by the queue worker containers.
pm.max_requests = 500
