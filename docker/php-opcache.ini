; OPcache tuning. Without this, PHP recompiles the entire app + vendor tree
; from source on every single request (opcache ships with php:8.4-fpm but is
; inert until enabled here) - a CPU cost that scales directly with traffic.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Recheck file mtimes at most every 2s - keeps compose.dev.yaml's live-mounted
; source picking up edits quickly, while costing effectively nothing in
; production where the source is baked into the image at build time.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
